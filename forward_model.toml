# Towed-seamount density-inversion datasets: forward_model.py (orchestrator) + forward_model.jl (Oceananigans).
# Closed 2D tank (walls at both ends, rigid lid) with a ridge towed along the floor.
# Datasets = [[cases]] x [receivers.sets]: 2 noise levels x 4 receiver sets = 8 datasets.

[grid]
Nx = 512           # dx = 5.9 cm: ~25 cells across the 1.5 m seamount
Nz = 128           # dz = 1.6 cm: >= 3 cells across the sharpest interfaces (d = 5 cm)
Lx = 30.0          # m, tank length
H = 2.0            # m, water depth

[physics]
g = 9.81
rho_ref = 1025.0
nu = 1.0e-6        # m^2/s, viscosity of water
kappa = 1.0e-7     # m^2/s, diffusivity of the density tracer

[seamount]
# Raised-cosine ridge spanning the tank width: height * cos^2(pi * xi / width) for |xi| < width / 2.
height = 1.0       # m
width = 1.5        # m, total footprint length along the tank
start_x = 22.5     # m, starting centre position (3/4 of the tank)
# Motion toward -x (the tank middle): speed * sin^2(pi (t - t_start) / duration) during
# [t_start, t_start + duration], at rest before and after. Travel = speed * duration / 2 = 6.25 m.
speed = 0.05       # m/s, peak speed (reached halfway, at t = 135 s)
t_start = 10.0     # s, at rest before this (quiet baseline)
duration = 250.0   # s, the seamount stops at t = 260 s

[run]
dt = 0.05          # s; CFL ~0.1-0.3 at peak speed, buoyancy periods >= 4.5 s (>= 90 steps each)
stop_time = 270.0  # s: 10 s quiet, 250 s of motion, 10 s quiet after the seamount stops
max_cfl = 0.8      # the run stops with a clear message if the advective CFL exceeds this
# Penalization of the moving seamount (defaults are tied to the grid and dt; normally leave out):
# penalization_rate = 10.0   # 1/s, default 0.5 / dt (must satisfy rate * dt <= 1)
# mask_smoothing = 0.03      # m, default dx / 2

[output]
interval = 1.0     # s between saved frames

[dataset]
seed = 2026
train = 1000
validation = 200
test = 200

# Density profiles: rho(z) = rho_ref - b * tanh((z - c) / d)
[profile.b]        # half the density jump [kg/m^3]: total jump 2-20 kg/m^3 (salt-stratified tank)
min = 1.0
max = 10.0

[profile.c]        # interface depth [m]
min = -1.5
max = -0.5

[profile.d]        # interface thickness scale [m]: transition over ~3d
min = 0.05
max = 0.35

[parallel]
# Concurrent Julia runs = cores // cores_per_forward_model (the batch script passes --cores).
# This 2D grid is small: several runs with few threads each finish the set sooner than few runs
# with many threads. Time one run at 4 and at 8 threads if you want to tune it.
allocated_cores = 144
cores_per_forward_model = 4
keep_netcdf = false    # full fields per run (~140 MB each) only if needed later
# fftw_threads = 1     # only if FFTW's multithreading crashes (seen on Windows)

[receivers]
# Receivers ride with the seamount (e.g. mounted on its carriage), on the floor beside it.
height_above_bottom = 0.02   # m (at least one grid cell, H / Nz)

[receivers.sets]
# Offsets from the seamount centre [m]: negative = ahead of it (toward -x), positive = behind.
# Keep |offset| >= 0.85 m (clear of the 1.5 m footprint); all stay inside the tank for the whole run.
r1 = [2.0]
r2 = [-2.0, 2.0]
r4 = [-4.0, -2.0, 2.0, 4.0]
r8 = [-6.0, -4.0, -2.0, -1.0, 1.0, 2.0, 4.0, 6.0]

# noise_std_pa: white-noise standard deviation in Pa, the same for every sample and receiver.
[[cases]]
name = "seamount_noiseless"
noise_std_pa = 0.0

[[cases]]
name = "seamount_noisy"
noise_std_pa = 0.8
